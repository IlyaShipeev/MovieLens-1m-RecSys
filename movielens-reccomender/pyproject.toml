[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recsys"
version = "0.1.0"
description = "Temporal two-stage movie recommendation experiment"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]
models = ["scipy>=1.12", "scikit-learn>=1.4", "implicit>=0.7", "catboost>=1.2", "streamlit>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

